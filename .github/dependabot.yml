# Dependabot: security updates only (no version-update PRs).
# Grouped security PRs open weekly on Tuesday morning (Europe/Bucharest).
# Auto-merge: .github/workflows/dependabot-auto-merge.yml (on PR + Tuesday cron).
# https://docs.github.com/en/code-security/dependabot/dependabot-security-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 0
    labels:
      - "dependabot-security"
      - "npm dependencies"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 0
    labels:
      - "dependabot-security"
      - "github dependencies"
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  # The test image base is pinned by digest. Version updates stay on (one PR at a time) so the digest
  # moves with the node:24-alpine tag; a new Node major is a deliberate change (CI and the Dockerfile
  # move together), not a PR. Such PRs are outside a security group, so dependabot-auto-merge.yml
  # leaves them for a person.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 1
    labels:
      - "docker dependencies"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
