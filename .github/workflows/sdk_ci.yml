# Run unit tests and coverage on every PR, and prove the built package works
# on the oldest Node.js that package.json "engines" allows.
name: SDK CI

on:
  # Started by dependabot-auto-merge.yml after it merges: a merge made with GITHUB_TOKEN
  # starts no push workflows.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces the run in progress; runs on main and on a schedule finish.
concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # 24 is the current LTS; 26 is the newest release line (endoflife.date).
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests and typecheck
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Typecheck declarations
        run: npm run dts-check

  # Jest and its toolchain cannot run on Node 18: Babel 8 is ESM-only, which
  # babel-jest can only require() on Node 20.19+, and npm 11 (needed for this
  # lockfile) does not install on Node 18. So the package is built and packed
  # on Node 24, then installed and exercised the way a consumer would on the
  # declared floor (18.0.0 and the latest 18.x), on 24 and on 26.
  dist-on-supported-node:
    name: Packed SDK on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["18.0.0", "18", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24 to build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and pack
        run: |
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"

      - name: Set up Node.js ${{ matrix.node }} to consume
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install the packed SDK and exercise it offline
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cp tests/dist-consumer.cjs "$RUNNER_TEMP/consumer/"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/zerobounce-zero-bounce-sdk-*.tgz
          node dist-consumer.cjs

  # Builds the Dockerfile and runs the documented test run in it, so a broken image
  # (a bad digest, a directory the unprivileged user cannot write) fails here and not in
  # a contributor's hands. The image's CMD runs the tests with coverage; --network=none
  # proves they need no network.
  docker:
    name: Docker test image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t zerobounce-javascript-test .

      - name: Run the tests in the image
        run: docker run --rm --network=none zerobounce-javascript-test
