name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Tag to publish (e.g. v2.1.5)
        required: true
      skip_npm:
        type: boolean
        description: Skip the npm publish (GitHub release only, for example when npm refuses the push)
        default: false

permissions:
  contents: read

# One publish per tag at a time; a second run waits instead of cancelling a release half way.
concurrency:
  group: publish-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-tag:
    outputs:
      tag_sha: ${{ steps.tag_sha.outputs.sha }}
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate tag input
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          re='^v[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "Error: the tag input must be a release tag such as v1.2.3."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.inputs.tag }}

          persist-credentials: false
      - name: Verify tag and package version
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "Error: Tag is required."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Error: Tag '$TAG' does not exist."
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PKG_VERSION) does not match tag ($TAG)."
            exit 1
          fi
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          LOCK_ROOT_VERSION=$(node -p "require('./package-lock.json').packages[''].version")
          if [ "$LOCK_VERSION" != "$TAG_VERSION" ] || [ "$LOCK_ROOT_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package-lock.json version ($LOCK_VERSION, packages[''] $LOCK_ROOT_VERSION) does not match tag ($TAG)."
            exit 1
          fi

      - name: Record tag commit SHA
        id: tag_sha
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    timeout-minutes: 30
    needs: [validate-tag]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag }}
          persist-credentials: false

      - name: Verify checkout matches validated SHA
        env:
          TAG_SHA: ${{ needs.validate-tag.outputs.tag_sha }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ -z "$TAG_SHA" ] || [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "Error: checked-out commit ($HEAD_SHA) does not match the validated tag commit ($TAG_SHA)."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # Gate on what actually ships. The published package has no runtime
      # dependencies and contains only dist/, so a devDependency advisory
      # cannot reach a consumer and must not block a release.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=low

      # Full tree, including devDependencies. Informational: it surfaces
      # advisories in the build toolchain without holding up a publish.
      - name: Audit build toolchain (informational)
        continue-on-error: true
        run: npm audit --audit-level=low

      - name: Test
        run: npm test

      # The tag's own dist: build it, smoke-test it, and install the packed tarball the way a
      # consumer would.
      - name: Build and smoke-test the dist
        run: |
          npm run build
          npm run test:smoke
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer"
          cp tests/dist-consumer.cjs "$RUNNER_TEMP/consumer/"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/zerobounce-zero-bounce-sdk-*.tgz
          node dist-consumer.cjs

  publish:
    name: Build and publish to npm
    needs: [validate-tag, test]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event.inputs.skip_npm != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag }}
          persist-credentials: false

      - name: Verify checkout matches validated SHA
        env:
          TAG_SHA: ${{ needs.validate-tag.outputs.tag_sha }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ -z "$TAG_SHA" ] || [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "Error: checked-out commit ($HEAD_SHA) does not match the validated tag commit ($TAG_SHA)."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # What is published is smoke-tested first (the test job checked the same tag's build).
      - name: Smoke-test the dist
        run: npm run test:smoke

      # Trusted publishing (OIDC) needs npm 11.5.1 or later. Pin the exact version so a new npm
      # release is not picked up untested in this id-token: write job.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.19.1

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          fi
          npm publish --access public

  release:
    name: Create GitHub Release
    # Needs the tag validation and the tests only: a refused npm push must not block the release.
    needs: [validate-tag, test]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
          TAG_SHA: ${{ needs.validate-tag.outputs.tag_sha }}
        run: |
          if [ -z "$TAG_SHA" ]; then
            echo "Error: validated tag SHA is missing."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --verify-tag \
              --target "$TAG_SHA" \
              --generate-notes
          fi
